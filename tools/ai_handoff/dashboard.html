<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 协作进度</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f7fb; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d9e0ea; --accent:#315ce8; --accent-soft:#e9efff; --good:#138a55; --warn:#b76505; --bad:#c93645; --shadow:0 12px 32px rgba(31,44,75,.08); }
    :root[data-theme="dark"] { --bg:#101521; --panel:#171e2d; --ink:#edf2ff; --muted:#9ca9be; --line:#2b3548; --accent:#86a2ff; --accent-soft:#222f59; --good:#51d69a; --warn:#f5b85c; --bad:#ff7d89; --shadow:0 14px 35px rgba(0,0,0,.25); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:28px 0 52px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
    header > div:first-child, .hero-top > div:first-child { min-width:0; }
    h1 { font-size:clamp(24px,4vw,38px); margin:0 0 5px; letter-spacing:-.03em; }
    h2 { font-size:18px; margin:0 0 14px; }
    p { margin:0; }
    .sub { color:var(--muted); }
    .actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    button { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 12px; cursor:pointer; }
    .connection { display:inline-flex; align-items:center; gap:7px; font-weight:650; white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent); }
    .connection.live .dot { background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent); }
    .banner { display:none; padding:12px 15px; border:1px solid var(--warn); color:var(--warn); background:color-mix(in srgb,var(--warn) 8%,var(--panel)); border-radius:12px; margin-bottom:18px; }
    .banner.error { border-color:var(--bad); color:var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--panel)); }
    .hero { padding:24px; background:linear-gradient(135deg,var(--panel),var(--accent-soft)); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); margin-bottom:18px; }
    .hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
    .wp { color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .title { font-size:clamp(20px,3vw,29px); font-weight:760; margin:5px 0 12px; overflow-wrap:anywhere; }
    .status { display:inline-flex; align-items:center; padding:7px 12px; border-radius:999px; background:var(--accent); color:white; font-weight:750; }
    :root[data-theme="dark"] .status { color:#0c1220; }
    .round { min-width:112px; flex:0 0 auto; text-align:right; font-size:28px; font-weight:760; }
    .round small { display:block; color:var(--muted); font-size:12px; font-weight:600; }
    .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; }
    .card { grid-column:span 4; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); overflow-wrap:anywhere; }
    .card.wide { grid-column:span 8; }
    .card.full { grid-column:1/-1; }
    .label { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.04em; margin-bottom:5px; }
    .value { font-size:16px; font-weight:690; }
    .detail { color:var(--muted); margin-top:7px; }
    .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    .next { border-left:4px solid var(--accent); }
    .timeline { list-style:none; margin:0; padding:0; }
    .timeline li { position:relative; padding:0 0 17px 25px; border-left:2px solid var(--line); margin-left:6px; }
    .timeline li:last-child { border-left-color:transparent; padding-bottom:0; }
    .timeline li::before { content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:var(--accent); left:-7px; top:5px; border:2px solid var(--panel); }
    .timeline strong { display:block; }
    .empty { color:var(--muted); padding:18px 0; }
    .errors { margin:10px 0 0; padding-left:20px; color:var(--bad); }
    footer { color:var(--muted); margin-top:18px; font-size:12px; text-align:center; }
    @media (max-width:820px) { .card,.card.wide { grid-column:span 6; } }
    @media (max-width:560px) { .wrap { width:min(100% - 20px,1180px); padding-top:18px; } header,.hero-top { flex-direction:column; } .actions { justify-content:flex-start; } .round { text-align:left; } .card,.card.wide { grid-column:1/-1; } .hero { padding:18px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>AI 协作进度</h1><p class="sub">只读展示 Claude、Codex 与用户之间的当前交接。</p></div>
      <div class="actions"><span id="connection" class="connection"><span class="dot"></span><span>连接已断开</span></span><button id="theme" type="button">切换明暗</button></div>
    </header>
    <div id="degraded" class="banner"></div>
    <div id="execution-alert" class="banner error"></div>
    <section id="content"><div class="hero"><p class="empty">正在读取交接状态…</p></div></section>
    <footer id="footer">权威来源始终是 AI_REVIEW_HANDOFF.md · 面板不修改状态 · 正在读取执行安全门</footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "未记录").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const connection = $('connection');
    function setConnected(live) {
      connection.classList.toggle('live', live);
      connection.querySelector('span:last-child').textContent = live ? '实时连接正常' : '连接已断开';
    }
    function card(label, value, detail='', classes='') {
      return `<article class="card ${classes}"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ''}</article>`;
    }
    function render(data) {
      const degraded = $('degraded');
      if (data.system?.watcher_degraded) { degraded.style.display='block'; degraded.textContent='⚠ '+(data.system.watcher_message || '当前处于事件监听降级模式'); }
      else { degraded.style.display='none'; }
      const failure = data.execution_lifecycle?.failure_alert || data.system?.execution_failure_alert;
      const executionAlert = $('execution-alert');
      if (failure) { executionAlert.style.display='block'; executionAlert.textContent=`执行告警 · ${failure.code || 'failure'} · ${failure.message || '外部执行失败'}`; }
      else { executionAlert.style.display='none'; }
      const liveExecution = data.system?.external_processes_enabled === true;
      $('footer').textContent = `权威来源始终是 AI_REVIEW_HANDOFF.md · 面板不修改状态 · ${liveExecution ? '事件执行已显式启用' : '调度为 dry-run'}`;
      if (data.source_error || !data.current) {
        $('content').innerHTML = `<section class="hero"><div class="status">状态不可用</div><p class="bad" style="margin-top:14px">${esc(data.source_error || '未找到工作包')}</p><p class="detail">面板没有猜测状态，将在文件恢复后重读。</p></section>`;
        return;
      }
      const p=data.current, records=(p.records||[]).slice(-6).reverse();
      const phaseLabel = (k) => k==='self_review' ? 'Claude 交接前自审' : (k==='implementation' ? 'Claude 实施交接' : 'Codex 独立审核结论');
      const phaseTime = (r) => r.fields?.self_review_finished_at || r.fields?.implementation_finished_at || r.fields?.reviewed_at || '时间未记录';
      const phaseVerdict = (r) => r.kind==='self_review' ? (r.fields?.self_review_verdict ? '自审结论: '+r.fields.self_review_verdict : '') : (r.fields?.verdict ? 'Codex Verdict: '+r.fields.verdict : '');
      const timeline = records.length ? `<ol class="timeline">${records.map(r => `<li><strong>${esc(phaseLabel(r.kind))} · Round ${esc(r.round)}</strong><span class="detail">${esc(phaseTime(r))}</span>${phaseVerdict(r) ? `<div>${esc(phaseVerdict(r))}</div>`:''}</li>`).join('')}</ol>` : '<p class="empty">尚无自审/实施/审核记录。</p>';
      const srState = p.self_review_state || 'unknown';
      const srLegacy = srState === 'legacy';
      const srLabel = {
        'legacy': '历史格式（无结构化自审）',
        'v2-missing': 'v2 自审缺失',
        'v2-invalid': 'v2 自审无效',
        'v2-undeclared': '协议未声明（需 handoff_protocol: v2）',
        'v2-ok': p.self_review_verdict || 'PASS',
      }[srState] || (p.self_review_verdict || '未记录');
      const srVerdict = srLabel;
      const srDetail = (srState === 'v2-ok')
        ? `${p.self_review_started_at || '?'} → ${p.self_review_finished_at || '?'}`
        : (p.self_review_note || p.handoff_gate_reason || '');
      const srClass = srLegacy ? 'warn' : (srState === 'v2-ok' ? 'good' : 'bad');
      const srTests = srLegacy ? '历史记录未独立结构化' : (p.self_review_test_result || '未提取到自审测试计数（须来自结构化字段）');
      const srHash = srLegacy ? '无自审哈希' : (p.self_review_scope_sha256 ? p.self_review_scope_sha256.slice(0,16)+'…' : '缺少 self_review_scope_sha256');
      const gate = p.handoff_gate_ok ? '允许交接' : '拒绝交接';
      const gateDetail = p.handoff_gate_reason || (p.protocol_is_v2 ? '自审 PASS 且哈希/测试证据齐全' : '历史格式工作包：门禁不强制');
      const diagnostics = [...(p.errors||[]), ...(p.warnings||[])];
      const hashEvidence = [p.scope_baseline_sha256,p.implementation_scope_sha256,p.review_started_sha256,p.review_finished_sha256];
      const hashCount = hashEvidence.filter(Boolean).length;
      const hashMatch = data.dispatch?.scope_current_sha256 && data.dispatch?.scope_current_sha256 === data.dispatch?.scope_expected_sha256;
      const hashDetail = hashMatch ? `当前重算值与 ${data.dispatch.scope_hash_basis} 一致` : (data.dispatch?.reason || '调度前将重新计算');
      const active = data.execution_lifecycle?.active;
      const lifecycleValue = active ? `${active.actor || 'AI'} · ${active.state || 'running'}` : '当前无外部执行';
      const lifecycleDetail = active ? `${active.work_package_id || ''} · PID ${active.child_pid || '等待启动'}` : (data.execution_lifecycle?.last_event?.outcome || '尚无生产执行记录');
      $('content').innerHTML = `
        <section class="hero"><div class="hero-top"><div><div class="wp">${esc(p.work_package_id)}</div><div class="title">${esc(p.title)}</div><span class="status">${esc(p.status_explanation || p.canonical_status || p.status)}</span></div><div class="round">${esc(p.round)} / ${esc(p.max_rounds)}<small>当前轮次</small></div></div>${diagnostics.length?`<ul class="errors">${diagnostics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</section>
        <section class="grid">
          ${card('当前等待', p.waiting_for, p.canonical_status || p.status)}
          ${card('当前处理权', p.current_handler, 'owner')}
          ${card('当前写入权', p.write_access)}
          ${card('状态最后更新', p.last_updated_at, '来自最近交接记录，不使用文件 mtime')}
          ${card('① Claude 交接前自审', srVerdict, srDetail, srClass)}
          ${card('① 自审测试与哈希', srTests, `self_review_scope_sha256: ${srHash}`, srLegacy ? 'warn' : '')}
          ${card('交接门禁', gate, gateDetail, p.handoff_gate_ok ? 'good' : 'bad')}
          ${card('② Claude 实施交接（原子状态转移）', p.latest_implementation_at || '尚未交接', p.latest_implementation_summary || '仅汇总产物并原子转移，不代替独立审核', 'wide')}
          ${card('③ Codex 独立审核结论', p.latest_review_verdict || '尚无 verdict', p.latest_review_summary || p.latest_review_at || '交接完成后由 Codex 独立启动', 'wide')}
          ${card('最近测试', p.latest_test_result || '未提取到测试结果', p.latest_test_count ? `最大记录数 ${p.latest_test_count}` : '')}
          ${card('Scope SHA-256 核验', hashMatch ? '当前文件与交接证据一致' : '调度已停止或待核验', `独立证据 ${hashCount}/4 · ${hashDetail}`, hashMatch ? 'good' : 'bad')}
          ${card('Claude 事件入口', data.system?.claude_trigger === 'available-disabled' ? '隔离演练已通过，生产未启用' : (data.system?.claude_trigger === 'unavailable' ? '不可用' : (data.system?.claude_trigger || '未知')), data.system?.claude_trigger_reason || '生产安全门打开前不调用任何外部进程', data.system?.claude_trigger === 'unavailable' ? 'bad' : 'good')}
          ${card('Codex 事件入口', data.system?.codex_trigger === 'available-disabled' ? '隔离演练已通过，生产未启用' : (data.system?.codex_trigger === 'unavailable' ? '不可用' : (data.system?.codex_trigger || '未知')), data.system?.codex_trigger_reason || '生产安全门打开前不调用任何外部进程', data.system?.codex_trigger === 'unavailable' ? 'bad' : 'good')}
          ${card('异步执行生命周期', lifecycleValue, lifecycleDetail, failure ? 'bad' : (active ? 'warn' : 'good'))}
          ${p.blocked_reason ? card('阻塞原因', p.blocked_reason, '', 'full bad') : ''}
          ${card('明确的下一步', p.next_action, data.dispatch?.reason || (liveExecution ? '等待合法状态事件' : 'dry-run 不会启动外部进程'), 'full next')}
          <article class="card full"><h2>简洁时间线</h2>${timeline}</article>
        </section>`;
    }
    async function initialLoad() {
      try { const response=await fetch('/api/status',{cache:'no-store'}); if(!response.ok) throw new Error(response.status); render(await response.json()); }
      catch (_) { setConnected(false); }
    }
    function connect() {
      const stream = new EventSource('/api/events');
      stream.onopen = () => setConnected(true);
      stream.addEventListener('status', event => { setConnected(true); render(JSON.parse(event.data)); });
      stream.onerror = () => setConnected(false);
    }
    $('theme').addEventListener('click', () => { const dark=document.documentElement.dataset.theme==='dark'; document.documentElement.dataset.theme=dark?'light':'dark'; });
    const preferredDark=matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme=preferredDark?'dark':'light';
    setConnected(false); initialLoad(); connect();
  </script>
</body>
</html>
